[project]
name = "ilcalderone"
version = "0.1.0"
description = "Il Calderone — ricettario condiviso con varianti, raccolte e diario dei pasti"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "sqlalchemy>=2.0",
    "jinja2>=3.1",
    "python-multipart>=0.0.9",
    "itsdangerous>=2.2",
    "pillow>=10",
]

[project.optional-dependencies]
dev = ["pytest>=8", "httpx>=0.27", "openpyxl>=3.1"]

[tool.pytest.ini_options]
testpaths = ["tests"]
