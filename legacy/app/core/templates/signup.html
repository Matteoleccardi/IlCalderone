{% extends "base.html" %}
{% block title %}Registrati · Il Calderone{% endblock %}
{% block content %}
<article style="max-width: 28rem; margin: 2rem auto;">
  <h2>Nuovo account</h2>
  {% if error %}<p class="error">{{ error }}</p>{% endif %}
  <form method="post" action="/registrati">
    <input type="hidden" name="csrf" value="{{ csrf_token(request) }}">
    <label>Nome utente <input name="username" value="{{ username or '' }}" autocomplete="username" required></label>
    <label>Nome visualizzato <input name="display_name" value="{{ display_name or '' }}" placeholder="facoltativo"></label>
    <label>Password (min. 8 caratteri) <input type="password" name="password" autocomplete="new-password" minlength="8" required></label>
    <button>Crea account</button>
  </form>
  <p class="muted">Hai già un account? <a href="/login">Accedi</a></p>
</article>
{% endblock %}
