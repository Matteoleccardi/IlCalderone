{% extends "base.html" %}
{% block title %}Accedi · Il Calderone{% endblock %}
{% block content %}
<article style="max-width: 28rem; margin: 2rem auto;">
  <h2>Accedi</h2>
  {% if error %}<p class="error">{{ error }}</p>{% endif %}
  <form method="post" action="/login">
    <input type="hidden" name="csrf" value="{{ csrf_token(request) }}">
    <input type="hidden" name="next" value="{{ next }}">
    <label>Nome utente <input name="username" autocomplete="username" required autofocus></label>
    <label>Password <input type="password" name="password" autocomplete="current-password" required></label>
    <button>Entra</button>
  </form>
  <p class="muted">Non hai un account? <a href="/registrati">Registrati</a></p>
</article>
{% endblock %}
