<!-- <base href="/"> would turn a plain #main link into "go to the home page": focus <main> directly -->
<a class="skip" href="#main" (click)="$event.preventDefault(); mainEl.focus()">{{ 'app.skip' | t }}</a>
<header class="topbar">
  <a routerLink="/" class="brand" [attr.aria-label]="'app.home_label' | t">
    <app-brand />
  </a>
  @if (session.user(); as u) {
    <div class="who">
      <a routerLink="/account" routerLinkActive="active" [title]="'account.title' | t">{{ u.display }}</a>
      <span class="who-dot" aria-hidden="true"></span>
      <button type="button" class="logout" (click)="logout()" [title]="'app.logout' | t" [attr.aria-label]="'app.logout' | t">
        <svg viewBox="0 0 24 24" width="20" height="20" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="2.2"
          stroke-linecap="round" stroke-linejoin="round">
          <path d="M10 4H6a2 2 0 0 0-2 2v12a2 2 0 0 0 2 2h4" />
          <path d="M15 8l4 4-4 4" />
          <path d="M19 12H9" />
        </svg>
      </button>
    </div>
  }
</header>

<main id="main" tabindex="-1" #mainEl>
  <router-outlet />
</main>

<footer class="foot">
  <span>Il Calderone {{ session.state()?.version }}</span>
  <label class="lang">
    <span class="sr-only">{{ 'app.language' | t }}</span>
    <select [value]="i18n.lang" (change)="setLang($any($event.target).value)" [attr.aria-label]="'app.language' | t">
      @for (l of langs; track l.code) { <option [value]="l.code" [selected]="l.code === i18n.lang">{{ l.name }}</option> }
    </select>
  </label>
</footer>

@if (session.user()) {
  <app-timer-dock />
}

@if (session.user()) {
  <!-- the most used control: at the bottom, where the thumb is -->
  <nav class="bottom-nav" #bottomNav [attr.aria-label]="'app.nav_label' | t">
    @for (n of navItems(); track n.path) {
      <a [routerLink]="n.path" routerLinkActive="active" ariaCurrentWhenActive="page" [title]="n.label | t" [attr.aria-label]="n.label | t">
        <app-nav-icon [name]="n.path" />
      </a>
    }
  </nav>
}

<div class="toasts" aria-live="polite">
  @for (t of notify.toasts(); track t.id) {
    <div class="toast" [class.error]="t.kind === 'error'" [attr.role]="t.kind === 'error' ? 'alert' : 'status'">
      <span>{{ t.text }}</span>
      <button type="button" class="link" (click)="notify.dismiss(t.id)" [attr.aria-label]="'app.close' | t">✕</button>
    </div>
  }
</div>
